name: Release

# A tag such as v0.1.0 publishes that version: the installer and the packages Scion updates itself from.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the versions
        id: versions
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $velopack = ([xml](Get-Content Directory.Packages.props)).Project.ItemGroup.PackageVersion | Where-Object { $_.Include -eq 'Velopack' } | ForEach-Object { $_.Version }
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$version") {
            throw "The tag is $tag, but Directory.Build.props says the version is $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "velopack=$velopack" >> $env:GITHUB_OUTPUT
          # The one source of the release notes: the update dialog shows them (through the package) and the release page carries the same text.
          $notes = "docs/releases/$version.md"
          if (Test-Path $notes) { "notes=$notes" >> $env:GITHUB_OUTPUT } else { "notes=" >> $env:GITHUB_OUTPUT }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet publish src/Scion.Host.Desktop -c Release -r win-x64 --self-contained -o publish

      # vpk must be the same version as the Velopack package inside the app.
      - run: dotnet tool install -g vpk --version ${{ steps.versions.outputs.velopack }}

      # The previous release lets vpk build a delta package. The first release has none, and a missing delta only makes the update larger.
      - name: Download the previous release
        continue-on-error: true
        run: vpk download github --repoUrl $env:REPO_URL --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        shell: pwsh
        run: |
          $arguments = @('pack', '-u', 'Scion', '-v', '${{ steps.versions.outputs.version }}', '-p', 'publish', '-e', 'Scion.Host.Desktop.exe', '--packTitle', 'Scion', '--icon', 'src/Scion.Host.Desktop/Assets/scion.ico')
          if ('${{ steps.versions.outputs.notes }}') { $arguments += @('--releaseNotes', '${{ steps.versions.outputs.notes }}') }
          vpk @arguments

      # The website's download button points at this file name on the latest release.
      - name: Installer keeps its name
        shell: pwsh
        run: |
          if (-not (Test-Path Releases/Scion-win-Setup.exe)) {
            throw "Releases/Scion-win-Setup.exe is missing: the website's download link goes to this name."
          }

      - name: Upload
        run: >
          vpk upload github
          --repoUrl $env:REPO_URL
          --publish
          --releaseName "Scion ${{ steps.versions.outputs.version }}"
          --tag v${{ steps.versions.outputs.version }}
          --token ${{ secrets.GITHUB_TOKEN }}

      # Makes sure the release page says what the package says, whether or not vpk wrote the notes itself.
      - name: Release notes on the release page
        if: steps.versions.outputs.notes != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit v${{ steps.versions.outputs.version }} --notes-file ${{ steps.versions.outputs.notes }}

  # The macOS zip for Apple silicon, attached to the release the job above has just published. It is a plain zip with Scion.app:
  # Scion's updater (Velopack) does not know it, so a Mac installs a new version by downloading it again. The file name is the one
  # the website links to (releases/latest/download/Scion-osx-arm64.zip); a test ties the page to this name.
  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Make Scion.app and zip it
        run: bash tools/macos/package-app.sh osx-arm64 "${GITHUB_REF_NAME#v}" Scion-osx-arm64.zip

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" Scion-osx-arm64.zip --clobber

name: Release

# A tag such as v0.1.0 publishes that version: the installer and the packages Scion updates itself from.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the versions
        id: versions
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $velopack = ([xml](Get-Content Directory.Packages.props)).Project.ItemGroup.PackageVersion | Where-Object { $_.Include -eq 'Velopack' } | ForEach-Object { $_.Version }
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$version") {
            throw "The tag is $tag, but Directory.Build.props says the version is $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "velopack=$velopack" >> $env:GITHUB_OUTPUT
          # The one source of the release notes: the update dialog shows them (through the package) and the release page carries the same text.
          $notes = "docs/releases/$version.md"
          if (Test-Path $notes) { "notes=$notes" >> $env:GITHUB_OUTPUT } else { "notes=" >> $env:GITHUB_OUTPUT }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet publish src/Scion.Host.Desktop -c Release -r win-x64 --self-contained -o publish

      # vpk must be the same version as the Velopack package inside the app.
      - run: dotnet tool install -g vpk --version ${{ steps.versions.outputs.velopack }}

      # The previous release lets vpk build a delta package. The first release has none, and a missing delta only makes the update larger.
      - name: Download the previous release
        continue-on-error: true
        run: vpk download github --repoUrl $env:REPO_URL --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        shell: pwsh
        run: |
          $arguments = @('pack', '-u', 'Scion', '-v', '${{ steps.versions.outputs.version }}', '-p', 'publish', '-e', 'Scion.Host.Desktop.exe', '--packTitle', 'Scion', '--icon', 'src/Scion.Host.Desktop/Assets/scion.ico')
          if ('${{ steps.versions.outputs.notes }}') { $arguments += @('--releaseNotes', '${{ steps.versions.outputs.notes }}') }
          vpk @arguments

      # The website's download button points at this file name on the latest release.
      - name: Installer keeps its name
        shell: pwsh
        run: |
          if (-not (Test-Path Releases/Scion-win-Setup.exe)) {
            throw "Releases/Scion-win-Setup.exe is missing: the website's download link goes to this name."
          }

      - name: Upload
        run: >
          vpk upload github
          --repoUrl $env:REPO_URL
          --publish
          --releaseName "Scion ${{ steps.versions.outputs.version }}"
          --tag v${{ steps.versions.outputs.version }}
          --token ${{ secrets.GITHUB_TOKEN }}

      # Makes sure the release page says what the package says, whether or not vpk wrote the notes itself.
      - name: Release notes on the release page
        if: steps.versions.outputs.notes != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit v${{ steps.versions.outputs.version }} --notes-file ${{ steps.versions.outputs.notes }}

  # The Mac packages, added to the release the job above has just published: osx-arm64 is Apple silicon, osx-x64 is Intel. Each is signed
  # with a Developer ID, notarized and stapled (tools/macos/pack.sh), and Scion updates itself from the same release through its own
  # feed (releases.<runtime id>.json: the runtime id is Velopack's channel). The zip people download is Scion-<runtime id>-Portable.zip,
  # the name the website links to (releases/latest/download/<file>); a test ties the page to these names. The signing keychain lives only
  # for this job: its last step runs whatever happened before it.
  macos:
    needs: release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            file: Scion-osx-arm64-Portable.zip
          - rid: osx-x64
            file: Scion-osx-x64-Portable.zip
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read the versions
        id: versions
        run: |
          bash tools/macos/read-versions.sh >> "$GITHUB_OUTPUT"
          notes="docs/releases/$(sed -n 's/^version=//p' "$GITHUB_OUTPUT").md"
          if [ -f "$notes" ]; then echo "notes=$notes" >> "$GITHUB_OUTPUT"; else echo "notes=" >> "$GITHUB_OUTPUT"; fi

      # vpk must be the same version as the Velopack package inside the app.
      - name: Install vpk
        run: |
          dotnet tool install -g vpk --version ${{ steps.versions.outputs.velopack }}
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # The previous release lets vpk build a delta package. The first release of a Mac channel has none, and a missing delta only makes the update larger.
      - name: Download the previous release of this channel
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vpk download github --repoUrl "$REPO_URL" --channel ${{ matrix.rid }} --token "$GITHUB_TOKEN"

      - name: Signing keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash tools/macos/signing-keychain.sh create

      - name: Pack, sign and notarize
        run: bash tools/macos/pack.sh ${{ matrix.rid }} ${{ steps.versions.outputs.version }} ${{ steps.versions.outputs.notes }}

      # The website's download buttons point at these file names on the latest release.
      - name: Download keeps its name
        run: test -f Releases/${{ matrix.file }}

      - name: Add the packages to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vpk upload github --repoUrl "$REPO_URL" --merge --tag v${{ steps.versions.outputs.version }} --channel ${{ matrix.rid }} --token "$GITHUB_TOKEN"

      - name: Remove the signing keychain
        if: always()
        run: bash tools/macos/signing-keychain.sh delete

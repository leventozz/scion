name: Package macOS

# A package of the app to try on a Mac. It is not a release: nothing is published and Scion's updater never sees it (the release's
# own macOS zip is made by release.yml, with the same script). The result is a workflow artifact for each kind of Mac: osx-arm64 is
# Apple silicon, osx-x64 is Intel. Run it from the Actions tab, or push the branch macos-package.
on:
  workflow_dispatch:
  push:
    branches: [macos-package]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          if [ -z "$version" ]; then
            echo "Directory.Build.props has no <Version>." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Make Scion.app and zip it
        run: bash tools/macos/package-app.sh ${{ matrix.rid }} ${{ steps.version.outputs.version }} out/Scion-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip

      - name: Instructions
        run: |
          cat > out/README.txt <<'TEXT'
          Scion for macOS, a package to try. It is not signed with a developer identity, so macOS blocks it the first time.
          Unzip it, then run once in Terminal, in the folder that holds Scion.app:

            xattr -dr com.apple.quarantine Scion.app

          Then open Scion.app. If you pick the wrong kind of Mac (arm64 is Apple silicon, x64 is Intel) it will not start.
          Say what you see: it starts or not, the window, the project grid, adding a project, the skill pages, editing and copying.
          TEXT

      - uses: actions/upload-artifact@v4
        with:
          name: Scion-${{ steps.version.outputs.version }}-${{ matrix.rid }}
          path: out
          if-no-files-found: error
